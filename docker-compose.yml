# Contenedores del proyecto
services:
  backend:
    build:
      context: ./backend
    ports:
      - "8081:8081"
    volumes:
      - ./backend:/app
    env_file:
      - ./.env
    depends_on:
      - db
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_roles_and_permissions &&
             python manage.py seed_methodology_data &&
             python manage.py runserver 0.0.0.0:8081"

  frontend:
    build:
      context: ./frontend
    ports:
      - "5174:5174"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend

  db:
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5434:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: guiospro-redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  frontend_node_modules:
  postgres_data:
  redis_data:
